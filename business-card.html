<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Card — Melvin the Tree Guy</title>
<style>
  :root{
    --green:#1f6b3a;
    --green-dark:#134d29;
    --green-light:#e8f3ec;
    --cream:#faf8f4;
    --muted:#5c6b62;
    --fb:#1877f2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:#e6e3dc;
    padding:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .stage{
    width:100%;
    max-width:900px;
    container-type:inline-size;
  }
  .card{
    width:100%;
    aspect-ratio:1.75 / 1;
    background:var(--cream);
    border-radius:14px;
    border-left:2.2cqw solid var(--green);
    box-shadow:0 18px 45px rgba(0,0,0,.16);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:5.5cqw 5.5cqw 5.5cqw 5cqw;
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"";
    position:absolute;
    right:-8cqw; bottom:-8cqw;
    width:26cqw; height:26cqw;
    border-radius:50%;
    background:var(--green-light);
    opacity:.6;
  }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:3cqw;
    position:relative;
    z-index:1;
  }
  .brand{display:flex;align-items:center;gap:2.2cqw;}
  .tree{width:6.5cqw;height:6.5cqw;flex:none;}
  .name{
    font-size:4.3cqw;
    font-weight:800;
    color:var(--green-dark);
    line-height:1.05;
    letter-spacing:-.02em;
  }
  .tagline{
    font-size:1.9cqw;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.02em;
    margin-top:.7cqw;
  }
  .badge{
    background:var(--green);
    color:#fff;
    font-size:1.5cqw;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.3;
    padding:1.1cqw 1.7cqw;
    border-radius:1cqw;
    white-space:nowrap;
  }
  .services{
    font-size:2cqw;
    color:#3c4a42;
    line-height:1.55;
    font-weight:500;
    position:relative;
    z-index:1;
  }
  .services strong{color:var(--green-dark);font-weight:800;}
  .bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:3cqw;
    border-top:.25cqw solid #ddd6c8;
    padding-top:2.4cqw;
    position:relative;
    z-index:1;
  }
  .contact{
    display:flex;
    align-items:center;
    gap:1.4cqw;
    font-size:2.5cqw;
    font-weight:700;
    color:var(--green-dark);
  }
  .contact svg{width:3.3cqw;height:3.3cqw;flex:none;}
  .contact.phone svg{stroke:var(--green);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .contact.fb svg{fill:var(--fb);}
  .hint{
    font-size:.82rem;
    color:#7a7468;
    text-align:center;
    max-width:640px;
    line-height:1.5;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="top">
        <div class="brand">
          <svg class="tree" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 6 10h3l-4 6h5v6h4v-6h5l-4-6h3L12 2z" fill="#1f6b3a"/>
          </svg>
          <div>
            <div class="name">Melvin the Tree Guy</div>
            <div class="tagline">Tree Service &amp; Land Clearing</div>
          </div>
        </div>
        <div class="badge">Free<br>Estimates</div>
      </div>

      <div class="services">
        <strong>Trimming</strong> · Removal · <strong>Logging</strong> · Brush Removal<br>
        Stump Grinding · Firewood · <strong>Storm Cleanup</strong>
      </div>

      <div class="bottom">
        <div class="contact phone">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          <span>(417) 969-8066</span>
        </div>
        <div class="contact fb">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>
          <span>Melvin the Tree Guy</span>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">Rotate your phone to landscape for the biggest card, then screenshot just the card.</p>
</body>
</html>
